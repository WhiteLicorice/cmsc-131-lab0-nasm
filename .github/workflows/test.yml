name: reference-build
on: [push]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib

      - name: Record versions
        run: |
          nasm -v
          gcc --version

      - name: Build and check
        run: make check

      - name: Rebuild from clean
        run: |
          make clean
          make check

      # skel reads nothing, so every step above leaves read_int and read_char
      # untouched. readback calls both, and its fixture holds the echo they
      # print when stdin is a file rather than a terminal. Without this step
      # the ELF half of that echo could break here unnoticed.
      - name: Check a program that reads
        run: make PROG=readback check

      # readfail reads twice from an input that holds one word that is not a
      # number. Both reads must return 0 and echo nothing. Carter's read_int
      # returned an unset stack slot in that case, so this step is what keeps
      # the return value deterministic on the ELF build.
      - name: Check what read_int returns without a number
        run: make PROG=readfail check

      # checkfail prints exactly what skel.expected holds and then exits 1.
      # The check target must reject it and must name the exit status. A
      # check that compares output alone accepts this program, and an older
      # recipe did exactly that because a pipeline reports the status of its
      # last command. This step is what keeps that hole closed.
      - name: A nonzero exit status must fail the check
        run: |
          if make PROG=checkfail check; then
            echo "check accepted a program that exited nonzero"
            exit 1
          fi
          echo "check rejected checkfail as intended"

      # .note.GNU-stack is added to asm_io.inc and asm_io.asm for this course.
      # Without it binutils 2.39 and later warn that the missing section
      # implies an executable stack. This step is what proves the addition
      # actually works, so keep it.
      - name: Link must not warn about an executable stack
        run: |
          make clean
          make 2>&1 | tee build.log
          if grep -qi "executable stack" build.log; then
            echo "linker warned about an executable stack"
            exit 1
          fi
